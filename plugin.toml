id = "pedro.laravel-openidea"
name = "Laravel OpenIDEA"
version = "0.14.1"
description = "The Laravel toolkit for OpenIDEA. Completion, go to definition and checks for every Laravel string: routes, views, config, translations, env keys, validation rules, gates, middleware, Blade and Livewire components and Inertia pages. Eloquent that knows your models: relations, scopes, casts, enum members and whole query chains complete and resolve, and Copy Query as MySQL turns any chain into the SQL it runs. Inspections with quick fixes catch N+1 queries, unknown columns, env() outside config, keys missing from $fillable and repeated array keys, and a selected $request->validate([...]) becomes a Form Request. The Laravel OpenIDEA hub adds Artisan, Tinker in tabs, routes, models, events, queues, schedule, cache keys, live logs, SQL to Laravel in both directions and a Live Audit of every request, query, job and mail with N+1 and slow query insights. An MCP server lets AI agents read your routes, models and logs. Docs, screenshots and a video tour: github.com/yzPeedro/laravel-openidea"
authors = ["yzPeedro"]
homepage = "https://github.com/yzPeedro/laravel-openidea"
license = "MIT"
categories = ["frameworks", "tools", "ai"]
icon = "icons/plugin.svg"
change-notes = "0.14.1 — Listed in the OpenIDEA marketplace, with its own icon, categories and a fuller description. 0.14.0 — Requires OpenIDEA 0.1.38 or newer. Eloquent chains complete what each step returns (collection, relation and query methods, local scopes, the model again) and enum or value-object casts complete their members, traits included; models extending a model inherit its relations and scopes; Ctrl+click on a scope call opens its declaration and on the declaration lists its calls; cast values complete every Laravel cast and its arguments; Live Audit, SQL to Laravel and back, Copy Query as MySQL and Extract Form Request (cursor or selection, with a name prompt); inspections with quick fixes for N+1 queries, unknown columns, env() outside config, keys outside $fillable, .env keys and repeated array keys; Pint, PHP CS Fixer and PHPStan on save; completion in composer.json, phpunit.xml, pint.json, .php-cs-fixer and .neon, Vite entries and route and translation keys in JavaScript and TypeScript; a Cache section with keys and values of every store; pagination in every hub table, Logs and Live Audit; terminals titled with their command; MCP access levels; the storage permission that keeps Tinker tabs and the Artisan history. 0.13.2 — The hub opens on Windows and macOS: it is now a web view loaded from the plugin's own files, so the IDE's content security policy no longer blocks its scripts and leaves it stuck on Loading. 0.13.1 — Blade files with multibyte characters (such as … or —) before a directive or comment no longer crash the plugin, which also left the hub stuck on Loading. 0.13.0 — Runs on official OpenIDEA 0.1.37 and newer; Folio pages as routes (name() completion, Ctrl+click, hub Routes section); named routes from the route cache, including package routes; pivot attributes after ->pivot-> or the ->as() accessor (keys, withPivot() columns, timestamps). 0.12.0 — Hub sections can be opened from messages (section, filters, search, Tinker snippets); Tinker resolves App\\Models and App classes by short name even before composer dump-autoload; Live Audit names Tinker and Artisan runs, ignores eval frames and opens at the top with its insights; route tests are matched by URI pattern; filter selects keep their labels. 0.11.0 — AI Agents: a laravel-openidea MCP server (app overview, routes, events and listeners, models with relations, scopes and observers, bindings, schedule, queues, commands, config with secrets masked, schema, missing translations, logs, Live Audit records with N+1 and slow query insights, Tinker) connected in one click to Claude Code, Codex, Cursor, Copilot, Junie and Gemini with guidelines in AGENTS.md and CLAUDE.md, next to Laravel Boost (install, boost:install, boost:update). Ecosystem: starter kit, Sanctum, Wayfinder, Horizon, Reverb, Octane, Pulse, Telescope and other packages with details and actions. Gutter link from route() usages to the route, tests per route in the hub, Go to Related Class or View for Livewire and Blade components, Generate @property PHPDoc for models from migrations, casts and relations. 0.10.0 — Tinker in the hub: editor tabs with PHP highlighting, Ctrl+Enter to run (Ctrl+Shift+Enter for the selection), snippets, Tinker-style coloured results per statement with echo output, dump(), SQL and timing; tabs are remembered. Live Audit: a local-only recorder (storage/openidea + vendor/autoload.php hook, no tracked file touched) streams requests, SQL with the calling line, events with payloads and listeners, jobs, cache, mail, notifications, HTTP client, gates, logs, exceptions and dumps, with type filters, request grouping and N+1, slow query and failure insights; secrets and personal data are masked. Profiles from Clockwork and Debugbar storage, leftover debug calls (dd, dump, ray, ds, var_dump…) and the installed debug toolbox. Artisan output keeps its colours. 0.9.0 — Hub: Laravel icon in the sidebar; Listeners (every listener and the events it listens to: discovered handle() types incl. unions, Event::listen, subscribers, $listen, queued flag), Observers, Scopes (local and global), Casts, Enums, Form Requests, API Resources, Controllers, Service Providers, Container Bindings, Validation Rules, Factories & Seeders, Macros, Drivers & Connections, Frontend and All Classes sections; filters on every section (locale, method, prefix, kind, folder, group…) with counts, sortable columns; log level chips with counts (click for one level, Ctrl+click to combine). Completion of Laravel, package and project traits after use, interfaces after implements and base classes after extends, ranked by folder. 0.8.0 — Laravel OpenIDEA hub: overview, Artisan, routes, models, database, views, components, config, env, translations, middleware, gates and policies, queues and workers, scheduling, events, mail and notifications, tests and live logs, with Material icons; every row opens its file; actions run in the terminal or show their output in place; Artisan runs in a throwaway Docker container when the project has a compose file; commands declared with #[Signature] and generator commands are listed. 0.7.0 — Tool windows: Artisan (every command of the app and its packages, arguments and options as a form, run in the IDE terminal, history; php or docker compose), Laravel Logs (live tail of storage/logs with level filters, search and stack traces), Routes (every route with method, URI, name, action and file). 0.6.0 — Blade highlighting and {{-- --}} comments (no HTML mode taking over); Material Icon Theme icons for Laravel files; .env completion of keys and values (connections, stores, disks, channels, mailers, locales, booleans) with navigation to the config that reads them; column completion for array keys still being typed in create() and update(). 0.5.0 — Laravel file icons (Blade, artisan, routes, controllers, requests, policies, migrations, seeders, factories, providers, resources, middleware); Blade directive completion after @, including custom Blade::directive and Blade::if; Ctrl+click on a route name or URI opens its controller method. 0.4.0 — Blade language with its own highlighting, structure and folding; model attributes (#[Fillable], #[Hidden], #[Guarded], #[Table]…); model member completion ( with every column, casts() from migrations, belongsTo/hasMany from foreign keys); relation items no longer insert (). 0.3.0 — OpenAPI (swagger-php attributes): $ref completion, navigation and unknown-ref inspection, tags, security schemes, path params, required properties, in/type/format values; Sanctum guards and token abilities, Spatie roles and permissions, Socialite drivers, Artisan commands, broadcast channels, queue names. 0.2.0 — Eloquent columns and relations, migrations, validation rules, middleware, gates and policies, disks, cache stores, queues, log channels, guards, Blade components, sections, stacks, Livewire, Inertia, assets, controller route markers, add-translation quick fix. 0.1.0 — routes, views, config, env and translations: completion, Go to Definition, view gutter markers, unknown view/route inspections, Artisan commands and run configurations."
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:php", "on-language:blade", "on-file:artisan"]

[capabilities]
required = ["project.read", "events", "storage"]
optional = ["process:php", "process:php-win", "process:docker", "editor.read", "editor.write", "clipboard"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "code-actions"]
languages = ["php", "blade", "dotenv"]

[[contributes.providers]]
kinds = ["completion", "code-actions"]
languages = ["json", "neon"]

[[contributes.providers]]
kinds = ["completion"]
languages = ["xml", "javascript", "typescript", "javascriptreact", "typescriptreact", "vue", "svelte"]

[[contributes.languages]]
path = "languages/blade.toml"

[[contributes.languages]]
path = "languages/neon.toml"

[[contributes.views]]
id = "laravel"
title = "Laravel OpenIDEA"
icon = "icons/laravel.svg"
location = "bottom"
web = "web/hub.html"

[[contributes.customEditors]]
id = "hub"
title = "Laravel OpenIDEA"
patterns = ["*.laravel-hub"]
priority = "default"
layout = "tab"
web = "web/hub.html"

[[contributes.commands]]
id = "refresh-index"
title = "Laravel: Refresh Index"
category = "Laravel"

[[contributes.commands]]
id = "open-hub-tab"
title = "Laravel: Open the Hub in an Editor Tab"
category = "Laravel"

[[contributes.commands]]
id = "related-file"
title = "Laravel: Go to Related Class or View"
category = "Laravel"

[[contributes.commands]]
id = "artisan-optimize-clear"
title = "Laravel: Artisan optimize:clear"
category = "Laravel"

[[contributes.commands]]
id = "artisan-migrate"
title = "Laravel: Artisan migrate"
category = "Laravel"

[[contributes.commands]]
id = "artisan-tinker"
title = "Laravel: Open Tinker"
category = "Laravel"

[[contributes.commands]]
id = "artisan-serve"
title = "Laravel: Artisan serve"
category = "Laravel"

[[contributes.commands]]
id = "copy-query-sql"
title = "Laravel: Copy Query as MySQL"
category = "Laravel"
when = "editorLangId == php"

[[contributes.commands]]
id = "run-in-tinker"
title = "Laravel: Run Selection in Tinker"
category = "Laravel"
when = "editorLangId == php && editorHasSelection"

[[contributes.menus]]
menu = "editor.context"
command = "copy-query-sql"
when = "editorLangId == php"

[[contributes.menus]]
menu = "editor.context"
command = "run-in-tinker"
when = "editorLangId == php && editorHasSelection"

[[contributes.commands]]
id = "extract-form-request"
title = "Laravel: Extract Form Request…"
category = "Laravel"
when = "editorLangId == php"

[[contributes.menus]]
menu = "editor.context"
command = "extract-form-request"
when = "editorLangId == php"

[[contributes.fileTemplates]]
id = "laravel-model"
name = "Laravel Model"
extension = "php"
path = "templates/model.php"

[[contributes.fileTemplates]]
id = "laravel-controller"
name = "Laravel Controller"
extension = "php"
path = "templates/controller.php"

[[contributes.fileTemplates]]
id = "laravel-form-request"
name = "Laravel Form Request"
extension = "php"
path = "templates/form-request.php"

[[contributes.fileTemplates]]
id = "laravel-policy"
name = "Laravel Policy"
extension = "php"
path = "templates/policy.php"

[[contributes.fileTemplates]]
id = "laravel-job"
name = "Laravel Job"
extension = "php"
path = "templates/job.php"

[[contributes.fileTemplates]]
id = "laravel-event"
name = "Laravel Event"
extension = "php"
path = "templates/event.php"

[[contributes.fileTemplates]]
id = "laravel-listener"
name = "Laravel Listener"
extension = "php"
path = "templates/listener.php"

[[contributes.fileTemplates]]
id = "laravel-middleware"
name = "Laravel Middleware"
extension = "php"
path = "templates/middleware.php"

[[contributes.fileTemplates]]
id = "pest-test"
name = "Pest Test"
extension = "php"
path = "templates/pest-test.php"

[[contributes.runDetectors]]
id = "artisan-serve"
name = "artisan serve"
files = ["artisan"]
command = "php"
args = ["artisan", "serve"]

[[contributes.runDetectors]]
id = "artisan-test"
name = "artisan test"
files = ["artisan"]
command = "php"
args = ["artisan", "test"]
test = true

[[contributes.fileIcons]]
id = "laravel-blade"
patterns = ["*.blade.php"]
icon = "icons/laravel.svg"

[[contributes.fileIcons]]
id = "laravel-artisan"
patterns = ["artisan"]
icon = "icons/laravel.svg"

[[contributes.fileIcons]]
id = "laravel-hub"
patterns = ["*.laravel-hub"]
icon = "icons/laravel.svg"

[[contributes.fileIcons]]
id = "laravel-routes"
patterns = ["web.php", "api.php", "channels.php", "console.php"]
icon = "icons/routing.svg"

[[contributes.fileIcons]]
id = "laravel-controller"
patterns = ["*Controller.php"]
icon = "icons/controller.svg"

[[contributes.fileIcons]]
id = "laravel-migration"
patterns = ["[0-9][0-9][0-9][0-9]_[0-9][0-9]_[0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9]_*.php"]
icon = "icons/database.svg"

[[contributes.fileIcons]]
id = "laravel-policy"
patterns = ["*Policy.php"]
icon = "icons/lock.svg"

[[contributes.fileIcons]]
id = "laravel-request"
patterns = ["*Request.php"]
icon = "icons/http.svg"

[[contributes.fileIcons]]
id = "laravel-provider"
patterns = ["*ServiceProvider.php"]
icon = "icons/settings.svg"

[contributes.settings]
schema = "settings.schema.json"
title = "Laravel OpenIdea"
