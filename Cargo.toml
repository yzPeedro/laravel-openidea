[package]
name = "openidea-plugin-laravel-openidea"
version = "0.13.0"
edition = "2024"
description = "Laravel OpenIDEA: the Laravel toolkit for the OpenIDEA IDE, as a WebAssembly plugin"
license = "MIT"
repository = "https://github.com/yzPeedro/laravel-openidea"
authors = ["Pedro Pessoa"]
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { path = "../openidea/sdk/rust/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
serde_json = "1"
