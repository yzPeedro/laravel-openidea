name: Feature request
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it should work. Code samples help a lot.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Completion and navigation", "Blade", "Eloquent", "Hub", "Tinker", "Live Audit", "Artisan", "AI agents", "Packages", "Other"]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today.
