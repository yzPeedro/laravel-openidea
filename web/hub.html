<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --gap-1: 4px; --gap-2: 8px; --gap-3: 12px; --gap-4: 16px; --gap-5: 24px; --gap-6: 32px;
    --radius: 8px; --radius-sm: 6px;
    --laravel: #ff2d20;
    --mono: var(--openidea-font-mono, ui-monospace, monospace);
    --get: #3fb950; --post: #4493f8; --put: #d29922; --patch: #d29922; --delete: #f85149; --any: #a371f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; font: var(--openidea-font-size, 13px)/1.45 var(--openidea-font-ui, system-ui, sans-serif); color: var(--openidea-fg); overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--openidea-focus-ring); outline-offset: 1px; border-radius: var(--radius-sm); }
  .icon { width: 18px; height: 18px; flex: none; display: inline-flex; }
  .icon svg { width: 100%; height: 100%; }
  .icon.lg { width: 28px; height: 28px; }
  .icon.xl { width: 40px; height: 40px; }

  /* sidebar */
  .sidebar { width: 236px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--openidea-border); background: color-mix(in srgb, var(--openidea-bg-elevated) 55%, transparent); }
  .brand { display: flex; gap: var(--gap-3); align-items: center; padding: var(--gap-4); border-bottom: 1px solid var(--openidea-border); }
  .brand .title { font-weight: 700; color: var(--openidea-fg-strong); letter-spacing: .01em; }
  .brand .sub { color: var(--openidea-fg-muted); font-size: .88em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  nav { flex: 1; overflow: auto; padding: var(--gap-2) var(--gap-2) var(--gap-4); }
  .nav-group { margin: var(--gap-4) var(--gap-2) var(--gap-1); font-size: .72em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--openidea-fg-muted); }
  .nav-item { width: 100%; display: flex; align-items: center; gap: var(--gap-3); padding: 7px var(--gap-3); border: 0; background: none; border-radius: var(--radius-sm); cursor: pointer; text-align: left; }
  .nav-item:hover { background: var(--openidea-bg-hover); }
  .nav-item.active { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); }
  .nav-item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: .78em; padding: 1px 7px; border-radius: 999px; background: var(--openidea-bg-input); color: var(--openidea-fg-muted); font-variant-numeric: tabular-nums; }

  /* main */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .header { display: flex; align-items: center; gap: var(--gap-4); padding: var(--gap-4) var(--gap-5); border-bottom: 1px solid var(--openidea-border); }
  .header .titles { flex: 1; min-width: 0; }
  .header h1 { margin: 0; font-size: 1.25em; font-weight: 650; color: var(--openidea-fg-strong); }
  .header p { margin: 2px 0 0; color: var(--openidea-fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search { position: relative; }
  .search input { width: 240px; padding: 7px 10px 7px 30px; border-radius: var(--radius-sm); border: 1px solid var(--openidea-border); background: var(--openidea-bg-input); }
  .search::before { content: ""; position: absolute; left: 10px; top: 50%; width: 9px; height: 9px; border: 1.6px solid var(--openidea-fg-muted); border-radius: 50%; transform: translateY(-62%); }
  .search::after { content: ""; position: absolute; left: 19px; top: 58%; width: 5px; height: 1.6px; background: var(--openidea-fg-muted); transform: rotate(45deg); }
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--gap-2); padding: var(--gap-3) var(--gap-5); border-bottom: 1px solid var(--openidea-border); }
  .toolbar:empty { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: var(--gap-2); align-items: center; padding: var(--gap-2) var(--gap-5); border-bottom: 1px solid var(--openidea-border); background: color-mix(in srgb, var(--openidea-bg-elevated) 45%, transparent); }
  .filters:empty { display: none; }
  .filters .flabel { font-size: .72em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--openidea-fg-muted); margin-right: var(--gap-1); }
  .facet { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border-radius: 999px; border: 1px solid var(--openidea-border); background: var(--openidea-bg-input); }
  .facet.on { border-color: var(--openidea-accent); background: color-mix(in srgb, var(--openidea-accent) 14%, var(--openidea-bg-input)); }
  .facet span { color: var(--openidea-fg-muted); font-size: .86em; }
  .facet select { border: 0; background: none; padding: 3px 4px; max-width: 220px; cursor: pointer; }
  .facet select:focus { outline: none; }
  .linkbtn { border: 0; background: none; color: var(--openidea-link); cursor: pointer; padding: 2px 6px; }
  .linkbtn:hover { text-decoration: underline; }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--openidea-fg-strong); }
  thead th .arrow { margin-left: 4px; font-size: .9em; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--openidea-border); background: var(--openidea-bg-elevated); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--openidea-bg-hover); }
  .btn.primary { background: var(--openidea-accent); border-color: transparent; color: var(--openidea-fg-on-accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: none; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn .kind { font-size: .72em; text-transform: uppercase; letter-spacing: .06em; color: var(--openidea-fg-muted); }
  .content { flex: 1; overflow: auto; }
  .pad { padding: var(--gap-5); }

  /* overview */
  .hero { display: flex; gap: var(--gap-5); align-items: center; padding: var(--gap-5); border-radius: 12px; border: 1px solid var(--openidea-border);
    background: linear-gradient(135deg, color-mix(in srgb, var(--laravel) 14%, transparent), transparent 60%), var(--openidea-bg-elevated); }
  .hero h2 { margin: 0 0 var(--gap-2); font-size: 1.6em; color: var(--openidea-fg-strong); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--gap-2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--openidea-border); background: var(--openidea-bg); font-size: .9em; }
  .chip .icon { width: 14px; height: 14px; }
  .chip.env { border-color: color-mix(in srgb, var(--laravel) 50%, transparent); color: var(--laravel); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--gap-3); margin-top: var(--gap-5); }
  .stat { display: flex; gap: var(--gap-3); align-items: center; padding: var(--gap-4); border-radius: var(--radius); border: 1px solid var(--openidea-border); background: var(--openidea-bg-elevated); cursor: pointer; text-align: left; transition: transform .12s ease, border-color .12s ease; }
  .stat:hover { border-color: var(--openidea-accent); transform: translateY(-1px); }
  .stat .num { font-size: 1.5em; font-weight: 700; color: var(--openidea-fg-strong); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .lbl { color: var(--openidea-fg-muted); font-size: .9em; }
  .block-title { margin: var(--gap-6) 0 var(--gap-3); font-size: .78em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--openidea-fg-muted); }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--gap-3); }
  .quick .btn { justify-content: flex-start; padding: var(--gap-3) var(--gap-4); border-radius: var(--radius); }
  .quick .btn .text { display: flex; flex-direction: column; align-items: flex-start; }
  .quick .btn .cmd { font-family: var(--mono); font-size: .85em; color: var(--openidea-fg-muted); }

  /* tables */
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  thead th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 600; font-size: .8em; letter-spacing: .05em; text-transform: uppercase; color: var(--openidea-fg-muted);
    padding: var(--gap-2) var(--gap-4); background: var(--openidea-bg); border-bottom: 1px solid var(--openidea-border); }
  tbody td { padding: 7px var(--gap-4); border-bottom: 1px solid color-mix(in srgb, var(--openidea-border) 55%, transparent); vertical-align: top; max-width: 560px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr.link { cursor: pointer; }
  tbody tr:hover { background: var(--openidea-bg-hover); }
  tbody tr .go { opacity: 0; color: var(--openidea-link); font-size: .85em; white-space: nowrap; }
  tbody tr:hover .go { opacity: 1; }
  td.mono, td .mono { font-family: var(--mono); }
  td.wrap { white-space: normal; color: var(--openidea-fg-muted); }
  td.first { color: var(--openidea-fg-strong); font-weight: 500; }
  .method { display: inline-block; min-width: 58px; text-align: center; padding: 1px 8px; border-radius: 5px; font: 600 .78em var(--mono); color: #fff; background: var(--any); }
  .method.GET, .method.HEAD { background: var(--get); } .method.POST { background: var(--post); } .method.PUT, .method.PATCH { background: var(--put); } .method.DELETE { background: var(--delete); }
  .count { padding: var(--gap-2) var(--gap-5); color: var(--openidea-fg-muted); font-size: .88em; border-top: 1px solid var(--openidea-border); }
  .empty { display: flex; flex-direction: column; align-items: center; gap: var(--gap-3); padding: var(--gap-6); color: var(--openidea-fg-muted); text-align: center; }
  .empty .icon { opacity: .7; }
  .loading { padding: var(--gap-5); }
  .skeleton { height: 14px; border-radius: 4px; margin: 10px 0; background: linear-gradient(90deg, var(--openidea-bg-hover), var(--openidea-bg-elevated), var(--openidea-bg-hover)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* artisan */
  .artisan { display: flex; height: 100%; }
  .commands { width: 300px; flex: none; overflow: auto; border-right: 1px solid var(--openidea-border); padding: var(--gap-2) 0; }
  .cmd-group { padding: var(--gap-3) var(--gap-4) var(--gap-1); font-size: .72em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--openidea-fg-muted); }
  .cmd { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 5px var(--gap-4) 5px var(--gap-5); cursor: pointer; }
  .cmd:hover { background: var(--openidea-bg-hover); }
  .cmd.active { background: var(--openidea-bg-selected); }
  .cmd .n { font-family: var(--mono); color: var(--openidea-fg-strong); }
  .cmd .d { display: block; color: var(--openidea-fg-muted); font-size: .86em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmd .tag { font-size: .7em; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: color-mix(in srgb, var(--laravel) 18%, transparent); color: var(--laravel); }
  .form { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .form-body { flex: 1; overflow: auto; padding: var(--gap-5); }
  .form h2 { margin: 0; font: 650 1.2em var(--mono); color: var(--openidea-fg-strong); }
  .form h2.link { cursor: pointer; } .form h2.link:hover { color: var(--openidea-link); text-decoration: underline; }
  .form .desc { margin: var(--gap-1) 0 var(--gap-4); color: var(--openidea-fg-muted); }
  fieldset { border: 1px solid var(--openidea-border); border-radius: var(--radius); padding: var(--gap-3) var(--gap-4); margin: 0 0 var(--gap-4); }
  legend { padding: 0 var(--gap-2); font-size: .78em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--openidea-fg-muted); }
  .field { display: grid; grid-template-columns: 230px 1fr; gap: var(--gap-3); align-items: center; padding: 6px 0; }
  .field label { font-family: var(--mono); }
  .field .hint { grid-column: 2; margin-top: -4px; color: var(--openidea-fg-muted); font-size: .88em; }
  .field input[type=text] { padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--openidea-border); background: var(--openidea-bg-input); }
  .req { color: var(--openidea-danger); }
  .runbar { display: flex; gap: var(--gap-2); align-items: center; padding: var(--gap-3) var(--gap-5); border-top: 1px solid var(--openidea-border); background: var(--openidea-bg-elevated); }
  .runbar code { flex: 1; font-family: var(--mono); padding: 6px 10px; border-radius: var(--radius-sm); background: var(--openidea-bg-input); border: 1px solid var(--openidea-border); white-space: nowrap; overflow: auto; }

  /* logs */
  .logbar { position: sticky; top: 0; z-index: 2; background: var(--openidea-bg); display: flex; flex-wrap: wrap; gap: var(--gap-2); align-items: center; padding: var(--gap-3) var(--gap-5); border-bottom: 1px solid var(--openidea-border); }
  .logbar select { padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--openidea-border); background: var(--openidea-bg-input); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--openidea-border); background: none; cursor: pointer; font-size: .82em; text-transform: uppercase; letter-spacing: .04em; opacity: .55; }
  .pill:hover { opacity: .85; }
  .pill[aria-pressed=true] { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); border-color: currentColor; font-weight: 600; }
  .pill .n { font-variant-numeric: tabular-nums; font-size: .92em; padding: 0 6px; border-radius: 999px; background: color-mix(in srgb, currentColor 18%, transparent); }
  .pill.zero { opacity: .3; }
  .levels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sep { width: 1px; align-self: stretch; background: var(--openidea-border); margin: 0 var(--gap-1); }
  .entry { padding: var(--gap-2) var(--gap-5); border-bottom: 1px solid color-mix(in srgb, var(--openidea-border) 55%, transparent); }
  .entry .head { display: flex; gap: var(--gap-3); align-items: baseline; }
  .entry.has-details .head { cursor: pointer; }
  .entry:hover { background: var(--openidea-bg-hover); }
  .lvl { flex: none; min-width: 74px; text-align: center; padding: 1px 8px; border-radius: 5px; font: 600 .74em var(--mono); text-transform: uppercase; border: 1px solid currentColor; }
  .time { flex: none; font-family: var(--mono); color: var(--openidea-fg-muted); font-size: .9em; }
  .msg { color: var(--openidea-fg-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .details { display: none; margin: var(--gap-2) 0 var(--gap-1); padding: var(--gap-3); border-radius: var(--radius-sm); background: var(--openidea-bg-input); font: .9em/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--openidea-fg-muted); }
  .open .details { display: block; }
  .open .msg { white-space: normal; }
  .error, .critical, .alert, .emergency { color: var(--openidea-danger); }
  .warning { color: var(--openidea-warning); }
  .notice, .info { color: var(--openidea-info); }
  .debug { color: var(--openidea-fg-muted); }
  a.frame { color: var(--openidea-link); text-decoration: none; cursor: pointer; } a.frame:hover { text-decoration: underline; }
  mark { background: color-mix(in srgb, var(--openidea-accent) 35%, transparent); color: inherit; border-radius: 2px; }

  /* output drawer */
  .drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; display: none; flex-direction: column; border-top: 1px solid var(--openidea-border); background: var(--openidea-bg-elevated); box-shadow: 0 -8px 24px rgba(0, 0, 0, .18); }
  .drawer.open { display: flex; }
  .drawer .bar { display: flex; align-items: center; gap: var(--gap-3); padding: var(--gap-2) var(--gap-4); border-bottom: 1px solid var(--openidea-border); }
  .drawer .bar code { flex: 1; font-family: var(--mono); color: var(--openidea-fg-strong); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--openidea-fg-muted); }
  .status-dot.ok { background: var(--openidea-success); } .status-dot.fail { background: var(--openidea-danger); }
  .status-dot.busy { background: var(--openidea-warning); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .drawer pre { flex: 1; margin: 0; overflow: auto; padding: var(--gap-4); font: .92em/1.5 var(--mono); white-space: pre; }
  .toast { position: absolute; right: var(--gap-5); bottom: var(--gap-5); max-width: 420px; padding: var(--gap-3) var(--gap-4); border-radius: var(--radius); background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-danger); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); display: none; }
  .toast.show { display: block; }
  /* ansi */
  .a-bold { font-weight: 700; } .a-ul { text-decoration: underline; }
  .a-31, .a-91 { color: var(--openidea-danger); } .a-32, .a-92 { color: var(--openidea-success); } .a-33, .a-93 { color: var(--openidea-warning); }
  .a-34, .a-94 { color: #4493f8; } .a-35, .a-95 { color: #c678dd; } .a-36, .a-96 { color: #2bb5c4; } .a-90, .a-37 { color: var(--openidea-fg-muted); }

  /* tinker */
  .tinker { display: flex; flex-direction: column; height: 100%; }
  .tk-tabs { display: flex; align-items: center; gap: 2px; padding: var(--gap-2) var(--gap-4) 0; border-bottom: 1px solid var(--openidea-border); }
  .tk-tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: none; cursor: pointer; color: var(--openidea-fg-muted); }
  .tk-tab.on { background: var(--openidea-bg-elevated); border-color: var(--openidea-border); color: var(--openidea-fg-strong); margin-bottom: -1px; }
  .tk-tab .x { opacity: .5; padding: 0 2px; border-radius: 4px; } .tk-tab .x:hover { opacity: 1; background: var(--openidea-bg-hover); }
  .tk-tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--openidea-warning); animation: pulse 1s infinite; }
  .tk-tools { margin-left: auto; display: flex; gap: var(--gap-2); align-items: center; padding-bottom: 6px; }
  .tk-tools select { padding: 5px 8px; border-radius: var(--radius-sm); border: 1px solid var(--openidea-border); background: var(--openidea-bg-input); max-width: 220px; }
  .tk-body { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(120px, var(--tk-split, 45%)) 6px 1fr; }
  .tk-resize { cursor: row-resize; background: var(--openidea-border); opacity: .5; } .tk-resize:hover { opacity: 1; background: var(--openidea-accent); }
  .editor { position: relative; display: flex; min-height: 0; overflow: auto; background: var(--openidea-bg-elevated); font: 13px/1.6 var(--mono); }
  .gutter { flex: none; padding: 10px 8px 10px 12px; text-align: right; color: var(--openidea-fg-muted); opacity: .6; user-select: none; white-space: pre; }
  .code-wrap { position: relative; flex: 1; min-width: 0; }
  .code-wrap pre, .code-wrap textarea { margin: 0; padding: 10px 12px; font: inherit; white-space: pre; tab-size: 4; border: 0; min-height: 100%; }
  .code-wrap pre { pointer-events: none; color: var(--openidea-fg); }
  .code-wrap textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--openidea-fg-strong); outline: none; overflow: hidden; }
  .code-wrap textarea::selection { background: color-mix(in srgb, var(--openidea-accent) 35%, transparent); color: transparent; }
  .t-kw { color: #c678dd; } .t-str { color: #98c379; } .t-var { color: #e06c75; } .t-num { color: #d19a66; } .t-com { color: var(--openidea-fg-muted); font-style: italic; } .t-cls { color: #e5c07b; } .t-fn { color: #61afef; }
  .tk-out { overflow: auto; padding: var(--gap-3) var(--gap-5); font: 12.5px/1.55 var(--mono); }
  .tk-hint { color: var(--openidea-fg-muted); font-family: var(--openidea-font-ui, system-ui); padding: var(--gap-4) 0; }
  .tk-hint kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--openidea-border); border-radius: 4px; background: var(--openidea-bg-input); }
  .st { padding: var(--gap-2) 0; border-bottom: 1px dashed color-mix(in srgb, var(--openidea-border) 70%, transparent); }
  .st .in { display: flex; gap: var(--gap-3); color: var(--openidea-fg-muted); }
  .st .in code { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .st .in .meta { flex: none; font-size: .9em; }
  .st .res { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .st .res::before { content: "= "; color: var(--openidea-fg-muted); }
  .st .echo { white-space: pre-wrap; color: var(--openidea-fg-strong); margin-top: 2px; }
  .st .err { margin-top: 4px; padding: var(--gap-2) var(--gap-3); border-left: 3px solid var(--openidea-danger); background: color-mix(in srgb, var(--openidea-danger) 10%, transparent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; white-space: pre-wrap; }
  .st .err b { color: var(--openidea-danger); }
  .st .dumpv { margin-top: 2px; white-space: pre-wrap; padding-left: var(--gap-3); border-left: 2px solid #c678dd; }
  details.q { margin-top: 2px; color: var(--openidea-fg-muted); } details.q summary { cursor: pointer; } details.q div { padding: 2px 0 2px var(--gap-4); white-space: pre-wrap; }

  /* audit */
  .audit { display: flex; flex-direction: column; min-height: 100%; }
  .au-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: var(--gap-2); align-items: center; padding: var(--gap-3) var(--gap-5); border-bottom: 1px solid var(--openidea-border); background: var(--openidea-bg); }

  .rec .detail { display: none; padding: 0 var(--gap-5) var(--gap-3) calc(var(--gap-5) + 96px + 96px + var(--gap-3) * 2); }
  .rec.open .detail { display: block; } .rec.open .sum { white-space: normal; }
  .badge-t { display: inline-block; min-width: 84px; text-align: center; padding: 1px 6px; border-radius: 5px; font: 600 .74em var(--mono); text-transform: uppercase; border: 1px solid currentColor; }
  .ty-request { color: #4493f8; } .ty-query { color: #d19a66; } .ty-event { color: #c678dd; } .ty-job { color: #2bb5c4; } .ty-cache { color: #98c379; } .ty-mail, .ty-notification { color: #e5c07b; }
  .ty-exception { color: var(--openidea-danger); } .ty-log { color: var(--openidea-info); } .ty-dump { color: #e06c75; } .ty-http { color: #61afef; } .ty-gate { color: #56b6c2; } .ty-command, .ty-boot { color: var(--openidea-fg-muted); }

  .scope-head b { color: var(--openidea-fg-strong); font-family: var(--mono); }

  .kv .k { color: #e06c75; } .kv .s { color: #98c379; } .kv .n { color: #d19a66; } .kv .c { color: #e5c07b; } .kv .z { color: var(--openidea-fg-muted); }
  .kv ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px dotted var(--openidea-border); }

  .card h3 { margin: 0; display: flex; align-items: center; gap: var(--gap-3); color: var(--openidea-fg-strong); }

  .card .row { display: flex; flex-wrap: wrap; gap: var(--gap-2); align-items: center; }

  .tools { display: grid; gap: 10px; } .tools div { display: flex; flex-direction: column; gap: 1px; font-size: .92em; } .tools b { font-family: var(--mono); color: var(--openidea-fg-strong); font-weight: 500; } .tools span { color: var(--openidea-fg-muted); }

<body>
<aside class="sidebar">
  <div class="brand">
    <span class="icon lg" data-icon="laravel"></span>
    <div>
      <div class="title">Laravel OpenIDEA</div>
      <div class="sub" id="brand-sub">Loading…</div>
    </div>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
</aside>
<main>
  <header class="header">
    <span class="icon lg" id="section-icon"></span>
    <div class="titles"><h1 id="section-title"></h1><p id="section-desc"></p></div>
    <label class="search" id="search-box"><input id="search" type="search" placeholder="Filter…" aria-label="Filter"></label>
  </header>
  <div class="toolbar" id="toolbar"></div>
  <div class="filters" id="filters"></div>
  <div class="content" id="content"></div>
  <div class="count" id="count" hidden></div>
  <section class="drawer" id="drawer" aria-label="Command output">
    <div class="bar"><span class="status-dot" id="out-dot"></span><code id="out-cmd"></code><span class="badge" id="out-runner"></span>
      <button class="btn ghost" id="out-rerun">Run again</button><button class="btn ghost" id="out-close" aria-label="Close output">Close</button></div>
    <pre id="out-text"></pre>
  </section>
  <div class="toast" id="toast" role="alert"></div>
</main>
<script>
const ICONS = "__ICONS__";
const SECTIONS = [
  { group: "Project", id: "overview", title: "Overview", icon: "laravel", desc: "Your application at a glance" },
  { group: "Project", id: "ecosystem", title: "Ecosystem", icon: "packages", desc: "Starter kit, Sanctum, Wayfinder, Horizon, Reverb, Octane, Pulse and every first-party and popular package" },
  { group: "Project", id: "ai", title: "AI Agents", icon: "robot", desc: "Give Claude Code, Codex, Cursor, Copilot, Junie and Gemini the hub through MCP, with Laravel Boost" },
  { group: "Develop", id: "artisan", title: "Artisan", icon: "console", desc: "Every command of the app and its packages, with its arguments and options" },
  { group: "Develop", id: "tinker", title: "Tinker", icon: "php", desc: "Run PHP inside your app, in as many tabs as you like · Ctrl+Enter runs" },
  { group: "HTTP", id: "routes", title: "Routes", icon: "routing", desc: "Click a route to open its controller method", count: "routes" },
  { group: "HTTP", id: "controllers", title: "Controllers", icon: "controller", desc: "Controllers and their actions", count: "controllers" },
  { group: "HTTP", id: "requests", title: "Form Requests", icon: "api", desc: "Validated requests and their fields", count: "requests" },
  { group: "HTTP", id: "api-resources", title: "API Resources", icon: "resource", desc: "JSON resources and collections", count: "api-resources" },
  { group: "HTTP", id: "middleware", title: "Middleware", icon: "middleware", desc: "Middleware aliases and groups", count: "middleware" },
  { group: "Data", id: "models", title: "Models", icon: "database", desc: "Eloquent models, tables, relations and scopes", count: "models" },
  { group: "Data", id: "scopes", title: "Scopes", icon: "filter", desc: "Local and global query scopes", count: "scopes" },
  { group: "Data", id: "observers", title: "Observers", icon: "trigger", desc: "Model observers, the models they watch and their hooks", count: "observers" },
  { group: "Data", id: "casts", title: "Casts", icon: "mappings", desc: "Custom attribute casts", count: "casts" },
  { group: "Data", id: "enums", title: "Enums", icon: "enum", desc: "Enums with their cases", count: "enums" },
  { group: "Data", id: "database", title: "Database", icon: "migrations", desc: "Tables and columns from your migrations", count: "tables" },
  { group: "Data", id: "factories", title: "Factories & Seeders", icon: "seeders", desc: "Model factories and database seeders", count: "factories" },
  { group: "Views", id: "views", title: "Views", icon: "views", desc: "Blade views by name", count: "views" },
  { group: "Views", id: "components", title: "Components", icon: "components", desc: "Blade and Livewire components", count: "components" },
  { group: "Views", id: "frontend", title: "Frontend", icon: "vite", desc: "Vite assets, Inertia pages and components" },
  { group: "Views", id: "translations", title: "Translations", icon: "i18n", desc: "Translation keys per locale", count: "translations" },
  { group: "App", id: "classes", title: "All Classes", icon: "class", desc: "Every class, interface, trait and enum of the app, by kind", count: "classes" },
  { group: "App", id: "providers", title: "Service Providers", icon: "plugin", desc: "Providers, whether they are registered and what they bind", count: "providers" },
  { group: "App", id: "bindings", title: "Container Bindings", icon: "container", desc: "bind, singleton, scoped and instance registrations", count: "bindings" },
  { group: "App", id: "rules", title: "Validation Rules", icon: "rules", desc: "Custom validation rules", count: "rules" },
  { group: "App", id: "macros", title: "Macros", icon: "functions", desc: "Macros and mixins added to framework classes", count: "macros" },
  { group: "Configure", id: "config", title: "Config", icon: "settings", desc: "Every config key and its value", count: "config" },
  { group: "Configure", id: "env", title: "Environment", icon: "tune", desc: "Variables from .env and .env.example" },
  { group: "Configure", id: "services", title: "Drivers & Connections", icon: "connection", desc: "Databases, caches, disks, mailers, log channels, guards, broadcasting and rate limiters" },
  { group: "Configure", id: "policies", title: "Auth & Policies", icon: "policy", desc: "Gates, policies, roles, permissions, token abilities and guards", count: "abilities" },
  { group: "Run", id: "queues", title: "Queues & Workers", icon: "queue", desc: "Connections, queued jobs and workers" },
  { group: "Run", id: "schedule", title: "Scheduling", icon: "tasks", desc: "Scheduled tasks and the scheduler" },
  { group: "Run", id: "events", title: "Events", icon: "event", desc: "Events and the listeners that handle them", count: "events" },
  { group: "Run", id: "listeners", title: "Listeners", icon: "hook", desc: "Every listener and the events it listens to", count: "listeners" },
  { group: "Run", id: "mail", title: "Mail & Notifications", icon: "email", desc: "Mailables and notifications" },
  { group: "Run", id: "tests", title: "Tests", icon: "test", desc: "Test files, run them in the terminal" },
  { group: "Observe", id: "audit", title: "Live Audit", icon: "debug", desc: "Requests, queries, events with payloads and listeners, jobs, cache, mail, HTTP, gates, exceptions and dumps as they happen" },
  { group: "Observe", id: "logs", title: "Logs", icon: "log", desc: "storage/logs, live" },
  { group: "Observe", id: "profiles", title: "Profiles", icon: "dump", desc: "Requests, commands and jobs stored by Clockwork and Debugbar" },
  { group: "Observe", id: "debug-calls", title: "Debug Calls", icon: "dump", desc: "dd(), dump(), ray(), ds(), var_dump() and friends left in the code" },
  { group: "Observe", id: "debug-tools", title: "Debug Tools", icon: "packages", desc: "Debugbar, Clockwork, Telescope, Ray, LaraDumps, dump-server, Pail and the rest of the toolbox" },
];
const QUICK = [
  { label: "Serve", argv: ["serve"], mode: "terminal", icon: "http" },
  { label: "Tinker", argv: ["tinker"], mode: "terminal", icon: "php" },
  { label: "Run tests", argv: ["test"], mode: "terminal", icon: "test" },
  { label: "Start worker", argv: ["queue:work"], mode: "terminal", icon: "queue" },
  { label: "Run scheduler", argv: ["schedule:work"], mode: "terminal", icon: "tasks" },
  { label: "Clear caches", argv: ["optimize:clear"], mode: "capture", icon: "settings" },
  { label: "About", argv: ["about"], mode: "capture", icon: "laravel" },
  { label: "Migration status", argv: ["migrate:status"], mode: "capture", icon: "migrations" },
];
const LEVELS = ["emergency", "alert", "critical", "error", "warning", "notice", "info", "debug"];

const $ = (id) => document.getElementById(id);
const send = (msg) => openidea.postMessage(JSON.stringify(msg));
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.includes("-")) node.setAttribute(k, v);
    else node[k] = v;
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
};
const icon = (name, size = "") => {
  const span = el("span", { className: "icon " + size });
  span.innerHTML = ICONS[name] || "";
  return span;
};
const state = { section: "overview", overview: null, data: {}, facetSel: {}, sort: {}, commands: [], globals: [], history: [], runner: "", current: null, values: {},
  logs: { files: [], path: null, size: -1, entries: [], levels: new Set(LEVELS), expanded: false, hiddenBefore: 0 }, lastCapture: null };

document.querySelectorAll("[data-icon]").forEach((n) => { n.innerHTML = ICONS[n.dataset.icon] || ""; });

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 6000);
}

function highlight(text, q) {
  if (!q || !text) return [text || ""];
  const out = [];
  const lower = text.toLowerCase();
  let at = 0;
  for (let i = lower.indexOf(q); i >= 0; i = lower.indexOf(q, at)) {
    out.push(text.slice(at, i), el("mark", { textContent: text.slice(i, i + q.length) }));
    at = i + q.length;
  }
  out.push(text.slice(at));
  return out;
}

/* ---------- navigation ---------- */
function renderNav() {
  const nav = $("nav");
  nav.replaceChildren();
  let group = null;
  for (const s of SECTIONS) {
    if (s.group !== group) { group = s.group; nav.append(el("div", { className: "nav-group", textContent: group })); }
    const known = s.count && state.overview ? state.overview.counts[s.count] : s.id === "artisan" && state.overview ? state.overview.commands : null;
    const count = known != null ? known : state.data[s.id] ? state.data[s.id].rows.length : null;
    const b = el("button", { className: "nav-item" + (s.id === state.section ? " active" : "") }, icon(s.icon), el("span", { className: "label", textContent: s.title }), count != null ? el("span", { className: "badge", textContent: count }) : null);
    b.addEventListener("click", () => go(s.id));
    nav.append(b);
  }
}

function go(id) {
  state.section = id;
  const s = SECTIONS.find((x) => x.id === id);
  $("section-icon").replaceChildren(icon(s.icon, "lg"));
  $("section-title").textContent = s.title;
  $("section-desc").textContent = s.desc;
  $("search").value = "";
  $("search-box").hidden = id === "overview";
  $("toolbar").replaceChildren();
  $("filters").replaceChildren();
  $("count").hidden = true;
  renderNav();
  if (id === "overview") { renderOverview(); send({ type: "overview" }); }
  else if (id === "artisan") { renderArtisan(); if (!state.commands.length) send({ type: "init" }); }
  else if (id === "logs") { renderLogs(); send({ type: "files" }); }
  else if (id === "tinker") { renderTinker(); }
  else if (id === "audit") { renderAudit(); }
  else if (id === "ai") { renderAgents(); }
  else { loading(); send({ type: "section", id }); }
}

function loading() {
  const box = el("div", { className: "loading" });
  for (let i = 0; i < 8; i++) box.append(el("div", { className: "skeleton", style: "width:" + (40 + ((i * 37) % 55)) + "%" }));
  $("content").replaceChildren(box);
}

function emptyState(text, iconName = "laravel") {
  return el("div", { className: "empty" }, icon(iconName, "xl"), el("div", { textContent: text }));
}

/* ---------- actions ---------- */
function runAction(a) {
  if (a.mode === "capture") capture(a.argv); else send({ type: "run", argv: a.argv });
}

function capture(argv) {
  state.lastCapture = argv;
  $("drawer").classList.add("open");
  $("out-dot").className = "status-dot busy";
  $("out-cmd").textContent = "php artisan " + argv.join(" ");
  $("out-runner").textContent = state.runner || "";
  $("out-text").textContent = "Running…";
  send({ type: "capture", argv });
}

function actionButton(a) {
  const b = el("button", { className: "btn", title: (a.mode === "capture" ? "Show the output here: " : "Run in the terminal: ") + "php artisan " + a.argv.join(" ") },
    el("span", { textContent: a.label }), el("span", { className: "kind", textContent: a.mode === "capture" ? "output" : "terminal" }));
  b.addEventListener("click", () => runAction(a));
  return b;
}

$("out-close").addEventListener("click", () => $("drawer").classList.remove("open"));
$("out-rerun").addEventListener("click", () => state.lastCapture && capture(state.lastCapture));

/* ---------- overview ---------- */
function renderOverview() {
  const o = state.overview;
  const content = $("content");
  if (!o) { loading(); return; }
  const pad = el("div", { className: "pad" });
  const chips = el("div", { className: "chips" });
  if (o.env) chips.append(el("span", { className: "chip env", textContent: o.env }));
  if (o.laravel) chips.append(el("span", { className: "chip" }, icon("laravel"), "Laravel " + o.laravel));
  if (o.php) chips.append(el("span", { className: "chip" }, icon("php"), "PHP " + o.php));
  chips.append(el("span", { className: "chip", title: "How Artisan runs" }, icon(o.docker ? "docker" : "console"), o.runner));
  if (o.url) chips.append(el("span", { className: "chip" }, icon("http"), o.url));
  pad.append(el("div", { className: "hero" }, icon("laravel", "xl"), el("div", {}, el("h2", { textContent: o.name }), chips)));
  const grid = el("div", { className: "grid" });
  const stats = [["routes", "Routes", "routing", "routes"], ["models", "Models", "database", "models"], ["tables", "Tables", "migrations", "database"],
    ["views", "Views", "views", "views"], ["components", "Components", "components", "components"], ["config", "Config keys", "settings", "config"],
    ["translations", "Translations", "i18n", "translations"], ["middleware", "Middleware", "middleware", "middleware"], ["abilities", "Abilities", "policy", "policies"]];
  for (const [key, label, ic, target] of stats) {
    const card = el("button", { className: "stat" }, icon(ic, "lg"), el("div", {}, el("div", { className: "num", textContent: o.counts[key] ?? 0 }), el("div", { className: "lbl", textContent: label })));
    card.addEventListener("click", () => go(target));
    grid.append(card);
  }
  const cmdCard = el("button", { className: "stat" }, icon("console", "lg"), el("div", {}, el("div", { className: "num", textContent: o.commands }), el("div", { className: "lbl", textContent: "Artisan commands" })));
  cmdCard.addEventListener("click", () => go("artisan"));
  grid.append(cmdCard);
  pad.append(grid, el("div", { className: "block-title", textContent: "Quick actions" }));
  const quick = el("div", { className: "quick" });
  for (const q of QUICK) {
    const b = el("button", { className: "btn" }, icon(q.icon), el("span", { className: "text" }, el("span", { textContent: q.label }), el("span", { className: "cmd", textContent: "artisan " + q.argv.join(" ") })));
    b.addEventListener("click", () => runAction(q));
    quick.append(b);
  }
  pad.append(quick);
  if (o.packages.length) {
    pad.append(el("div", { className: "block-title", textContent: "Packages" }));
    const pk = el("div", { className: "chips" });
    for (const p of o.packages) pk.append(el("span", { className: "chip", textContent: p }));
    pad.append(pk);
  }
  content.replaceChildren(pad);
}

/* ---------- generic sections ---------- */
function parts(cell, split) {
  const v = cell == null || cell === "" ? "—" : String(cell);
  if (!split) return [v];
  const out = v.split(/\s*,\s*|\s*\|\s*/).map((x) => x.trim()).filter((x) => x && x !== "—");
  return out.length ? out : ["—"];
}

function compareCells(a, b) {
  const x = a == null ? "" : String(a), y = b == null ? "" : String(b);
  const nx = Number(x), ny = Number(y);
  if (x !== "" && y !== "" && !Number.isNaN(nx) && !Number.isNaN(ny)) return nx - ny;
  return x.localeCompare(y, undefined, { numeric: true, sensitivity: "base" });
}

function renderFilters(id, data, facets, base) {
  const bar = $("filters");
  const sel = state.facetSel[id];
  bar.replaceChildren();
  if (!facets.length) return;
  bar.append(el("span", { className: "flabel", textContent: "Filter" }));
  for (const f of facets) {
    const others = base.filter((r) => facets.every((g) => g === f || !sel[g.column] || parts(r.cells[g.idx], g.split).includes(sel[g.column])));
    const counts = new Map();
    for (const r of others) for (const v of new Set(parts(r.cells[f.idx], f.split))) counts.set(v, (counts.get(v) || 0) + 1);
    if (counts.size < 2 && !sel[f.column]) continue;
    const select = el("select", { "aria-label": f.column });
    select.append(el("option", { value: "", textContent: "All (" + others.length + ")" }));
    const values = [...counts.entries()].sort((a, b) => b[1] - a[1] || compareCells(a[0], b[0])).slice(0, 400);
    for (const [v, n] of values) select.append(el("option", { value: v, textContent: v + "  (" + n + ")" }));
    select.value = sel[f.column] || "";
    select.addEventListener("change", () => { if (select.value) sel[f.column] = select.value; else delete sel[f.column]; renderSection(id); });
    bar.append(el("label", { className: "facet" + (sel[f.column] ? " on" : "") }, el("span", { textContent: f.column }), select));
  }
  if (Object.keys(sel).length) {
    const reset = el("button", { className: "linkbtn", textContent: "Clear filters" });

function renderSection(id) {

  const body = el("tbody");

function quote(v) { return /^[\w.:\/@=,-]+$/.test(v) ? v : "'" + v.replace(/'/g, "'\\''") + "'"; }

function argv() {
  const c = state.current;
  if (!c) return [];
  const out = [c.name];
  for (const a of c.arguments) {
    const v = (state.values["arg:" + a.name] || "").trim();
    if (v) a.array ? out.push(...v.split(/\s+/)) : out.push(v);
  }
  for (const o of [...c.options, ...state.globals]) {
    const v = state.values["opt:" + o.name];
    if (o.value) {
      if (v == null || String(v).trim() === "") continue;
      for (const p of o.array ? String(v).split(",").map((s) => s.trim()).filter(Boolean) : [String(v).trim()]) out.push("--" + o.name + "=" + p);
    } else if (v === true) out.push("--" + o.name);
  }
  return out;
}

/* ---------- ansi + php highlight ---------- */
function ansi(text) {
  const out = document.createDocumentFragment();
  let cls = new Set();
  const re = /\x1b\[([\d;]*)m/g;
  let at = 0, m;
  const push = (t) => {
    if (!t) return;
    t = t.replace(/\\([<>])/g, "$1");
    if (!cls.size) { out.append(t); return; }
    out.append(el("span", { className: [...cls].join(" "), textContent: t }));
  };
  while ((m = re.exec(text))) {
    push(text.slice(at, m.index));
    at = re.lastIndex;
    for (const c of (m[1] || "0").split(";").map(Number)) {
      if (c === 0) cls = new Set();
      else if (c === 1) cls.add("a-bold");
      else if (c === 4) cls.add("a-ul");
      else if (c === 22) cls.delete("a-bold");
      else if (c === 24) cls.delete("a-ul");
      else if (c === 39) cls = new Set([...cls].filter((x) => !/^a-\d/.test(x)));
      else if ((c >= 30 && c <= 37) || (c >= 90 && c <= 97)) { cls = new Set([...cls].filter((x) => !/^a-\d/.test(x))); cls.add("a-" + c); }
    }
  }
  push(text.slice(at));
  return out;
}

const PHP_KW = new Set("abstract and array as break callable case catch class clone const continue declare default do echo else elseif empty enddeclare endfor endforeach endif endswitch endwhile enum extends final finally fn for foreach function global goto if implements include include_once instanceof insteadof interface isset list match namespace new or print private protected public readonly require require_once return static switch throw trait try unset use var while xor yield true false null self parent".split(" "));
function highlightPhp(code) {
  const frag = document.createDocumentFragment();
  const re = /(\/\/[^\n]*|#[^\[\n][^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\])*'?|"(?:\\.|[^"\\])*"?)|(\$[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|(\\?[A-Za-z_][\w\\]*)/g;
  let at = 0, m;
  while ((m = re.exec(code))) {
    if (m.index > at) frag.append(code.slice(at, m.index));
    let c = null;
    if (m[1]) c = "t-com"; else if (m[2]) c = "t-str"; else if (m[3]) c = "t-var"; else if (m[4]) c = "t-num";
    else if (m[5]) {
      const w = m[5];
      if (PHP_KW.has(w.toLowerCase())) c = "t-kw";
      else if (/^\\?[A-Z]/.test(w) || w.includes("\\")) c = "t-cls";
      else if (code[re.lastIndex] === "(") c = "t-fn";
    }
    frag.append(c ? el("span", { className: c, textContent: m[0] }) : m[0]);
    at = re.lastIndex;
  }
  frag.append(code.slice(at) + "\n");
  return frag;
}

  const gutter = el("div", { className: "gutter" });

    if (e.key === "Enter" && !e.ctrlKey) {

      const indent = (before.split("\n").pop().match(/^\s*/) || [""])[0] + (/[\{\[\(]\s*$/.test(before) ? "    " : "");
      if (indent) { e.preventDefault(); ta.setRangeText("\n" + indent, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }

    const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };

function runTinker(selection) {
  const T = state.tinker;

function interpolate(sql, bindings) {
  if (!bindings) return sql;
  const list = Array.isArray(bindings) ? bindings : Object.values(bindings);
  let i = 0;
  return sql.replace(/\?/g, () => {
    if (i >= list.length) return "?";
    const b = list[i++];
    return b === null ? "null" : typeof b === "number" || typeof b === "boolean" ? String(b) : "'" + String(b).replace(/'/g, "''") + "'";
  });
}

const AUDIT_TYPES = ["request", "query", "event", "job", "cache", "mail", "notification", "http", "gate", "log", "exception", "dump", "command", "boot"];
state.audit = { size: -1, records: [], types: new Set(AUDIT_TYPES.filter((t) => t !== "boot")), active: null, files: null, paused: false, follow: true, busy: false, error: null, checked: false, open: new Set() };

function auditSummary(r) {
  switch (r.type) {
    case "request": return [r.method + " " + r.uri + (r.query ? "?" + r.query : ""), (r.route || r.action || "") + (r.user != null ? " · user " + r.user : "")];
    case "query": return [interpolate(r.sql, r.bindings), r.connection];
    case "event": return [r.name, r.listeners && r.listeners.length ? "→ " + r.listeners.join(", ") : "no listeners"];
    case "job": return [r.job, r.status + (r.queue ? " · " + r.queue : "") + (r.error ? " · " + r.error : "")];
    case "cache": return [r.op + " " + r.key, r.store || ""];
    case "mail": return [r.subject || r.mailable || "mail", r.to];
    case "notification": return [r.notification, r.channel + " → " + (r.notifiable || "")];
    case "http": return [r.method + " " + r.url, String(r.status)];
    case "gate": return [r.ability, r.result ? "allowed" : "denied"];
    case "log": return [r.message, r.level];
    case "exception": return [r.class + ": " + r.message, (r.file || "").split("/").slice(-2).join("/") + ":" + r.line];
    case "dump": return [(r.value || "").split("\n")[0], ""];
    case "command": return ["artisan " + r.command, "exit " + r.exit];
    case "boot": return [r.context === "console" ? "console: " + (r.argv || "") : "http", "PHP " + r.php + " · Laravel " + r.laravel];
  }
  return [r.type, ""];
}

function kvTree(v, key) {
  const li = el("li");
  if (key != null) li.append(el("span", { className: "k", textContent: key }), ": ");
  if (v === null) li.append(el("span", { className: "z", textContent: "null" }));
  else if (typeof v === "string") li.append(el("span", { className: "s", textContent: JSON.stringify(v) }));
  else if (typeof v === "number" || typeof v === "boolean") li.append(el("span", { className: "n", textContent: String(v) }));
  else {
    const entries = Array.isArray(v) ? v.map((x, i) => [i, x]) : Object.entries(v);
    const cls = !Array.isArray(v) && (v["@model"] || v["@class"] || v["@collection"]);
    li.append(el("span", { className: "c", textContent: cls ? cls : Array.isArray(v) ? "array(" + v.length + ")" : "{}" }));
    const ul = el("ul");
    for (const [k, x] of entries) { if (["@model", "@class", "@collection"].includes(k)) continue; ul.append(kvTree(x, k)); }
    li.append(ul);
  }
  return li;
}

function sqlNode(sql) {
  const node = el("div", { className: "sql" });

  parts.forEach((p, i) => node.append(i % 2 ? el("span", { className: "kw", textContent: p }) : p));
  return node;
}

function auditInsights(records) {
  const out = [];
  const byScope = new Map();
  for (const r of records) { if (!byScope.has(r.scope)) byScope.set(r.scope, []); byScope.get(r.scope).push(r); }
  for (const [scope, list] of byScope) {
    const head = list.find((r) => r.type === "request") || list.find((r) => r.type === "job") || list.find((r) => r.type === "command") || list.find((r) => r.type === "boot");
    const label = head ? auditSummary(head)[0] : scope;
    const groups = new Map();
    for (const q of list.filter((r) => r.type === "query")) {
      const norm = q.sql.replace(/\s+/g, " ").replace(/\bin \([^)]*\)/gi, "in (…)");
      const k = norm + "@" + (q.file || "") + ":" + (q.line || "");
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(q);
    }
    for (const [, qs] of groups) if (qs.length >= 5) out.push({ bad: qs.length >= 20, title: "N+1? " + qs.length + "×", text: qs[0].sql + "  ·  " + label, file: qs[0].file, line: qs[0].line });
    for (const q of list.filter((r) => r.type === "query" && r.ms >= 100)) out.push({ bad: q.ms >= 500, title: "Slow query " + q.ms + " ms", text: q.sql + "  ·  " + label, file: q.file, line: q.line });
    for (const e of list.filter((r) => r.type === "exception")) out.push({ bad: true, title: "Exception", text: e.class + ": " + e.message + "  ·  " + label, file: e.file, line: e.line });
    for (const j of list.filter((r) => r.type === "job" && r.status === "failed")) out.push({ bad: true, title: "Job failed", text: j.job + "  ·  " + j.error, file: null });
    const req = list.find((r) => r.type === "request");
    if (req && req.ms >= 1000) out.push({ bad: req.ms >= 3000, title: "Slow request " + Math.round(req.ms) + " ms", text: label, file: null });
  }
  return out.slice(-12);
}

  ["list_artisan_commands", "Commands with usage"],
  ["get_config", "Config values, secrets masked"],
  ["database_schema", "Tables, columns, indexes, foreign keys"],
  ["missing_translations", "Keys missing per locale"],
  ["read_logs", "Latest log entries by level"],
  ["audit_recent", "Live Audit records plus N+1, slow query and failure insights"],
  ["run_tinker", "Run PHP in the booted app"],
  ["hub_sections", "Where things are in the hub"],
];
state.agents = { status: null, busy: false };

function renderAgents() {
  const G = state.agents;
  $("toolbar").replaceChildren();
  $("filters").replaceChildren();
  $("count").hidden = true;
  if (!G.status && !G.busy) { G.busy = true; send({ type: "agents", action: "agents-status" }); }
  const st = G.status || {};
  const connected = st.server && (st.configured || []).length;
  const busy = G.busy;
  const connect = el("button", { className: "btn " + (connected ? "" : "primary"), textContent: busy ? "Working…" : connected ? "Update connection" : "Connect AI agents", disabled: busy });
  connect.addEventListener("click", () => { G.busy = true; send({ type: "agents", action: "agents" }); renderAgents(); });
  const off = el("button", { className: "btn ghost", textContent: "Disconnect", disabled: busy || !connected });
  off.addEventListener("click", () => { G.busy = true; send({ type: "agents", action: "agents-off" }); renderAgents(); });
  const tools = el("div", { className: "tools" }, ...MCP_TOOLS.map(([n, d]) => el("div", {}, el("b", { textContent: n }), el("span", { textContent: d }))));
  const mcp = el("div", { className: "card" },
    el("h3", {}, icon("robot", "lg"), "Laravel OpenIDEA MCP server"),
    el("p", { textContent: "A stdio MCP server that boots your app and answers with the hub's data at runtime. Connecting copies it to storage/openidea (ignored by git), registers it in .mcp.json (Claude Code, Codex via ACP) and, when their folders exist, .cursor/mcp.json, .vscode/mcp.json (Copilot), .junie/mcp/mcp.json and .gemini/settings.json, and adds a short guide to AGENTS.md and CLAUDE.md (or to .ai/guidelines when Laravel Boost is installed, so boost:update merges it)." }),
    el("div", { className: "row" }, el("span", { className: "au-state " + (connected ? "on" : "off"), textContent: connected ? "● Connected" : "○ Not connected" }), connect, off),
    st.command ? el("code", { className: "cmdline", textContent: st.command }) : null,
    (st.configured || []).length ? el("div", { className: "chiplist" }, ...st.configured.map((f) => el("span", { textContent: f }))) : null,
    (st.guidelines || []).length ? el("p", { textContent: "Guidelines in " + st.guidelines.join(", ") }) : null,
    st.error ? el("div", { className: "insight bad" }, el("b", { textContent: "Error" }), el("span", { textContent: st.error })) : null,
    el("div", { className: "block-title", textContent: "Tools the agents get" }), tools);
  const boostInstalled = st.boost || !!st.boostVersion;
  const install = el("button", { className: "btn primary", textContent: "Install Boost" });
  install.addEventListener("click", () => send({ type: "composer", argv: ["require", "laravel/boost", "--dev"] }));
  const boostInstall = el("button", { className: "btn" + (boostInstalled ? " primary" : ""), textContent: "boost:install" });
  boostInstall.addEventListener("click", () => send({ type: "run", argv: ["boost:install"] }));
  const boostUpdate = el("button", { className: "btn", textContent: "boost:update" });
  boostUpdate.addEventListener("click", () => capture(["boost:update"]));
  const boost = el("div", { className: "card" },
    el("h3", {}, icon("laravel", "lg"), "Laravel Boost"),
    el("p", { textContent: "Laravel's official AI kit: an MCP server with documentation search for your exact package versions, database queries, browser logs and Tinker, plus versioned guidelines for Laravel, Livewire, Inertia, Filament, Pest and more. It works next to the Laravel OpenIDEA server; the agents get both." }),
    el("div", { className: "row" }, el("span", { className: "au-state " + (boostInstalled ? "on" : "off"), textContent: boostInstalled ? "● Installed " + (st.boostVersion || "") : "○ Not installed" }), boostInstalled ? null : install, boostInstall, boostInstalled ? boostUpdate : null),
    el("code", { className: "cmdline", textContent: boostInstalled ? "php artisan boost:install   # pick agents and editors\nphp artisan boost:update    # refresh guidelines, includes .ai/guidelines/laravel-openidea.md" : "composer require laravel/boost --dev\nphp artisan boost:install" }),
    (st.present || []).length ? el("div", {}, el("div", { className: "block-title", textContent: "Agent files in this project" }), el("div", { className: "chiplist" }, ...st.present.map((f) => el("span", { textContent: f })))) : null);
  const tips = el("div", { className: "card" },
    el("h3", {}, icon("debug", "lg"), "Debug with an agent"),
    el("p", { textContent: "1. Turn the recorder on in Live Audit.  2. Reproduce the bug (open the page, run the job or the command).  3. Ask the agent to call audit_recent: it sees the requests, SQL with the line that ran it, events with payloads and listeners, exceptions and N+1 patterns, then list_models, list_routes and run_tinker to confirm." }));
  $("content").replaceChildren(el("div", { className: "cards" }, mcp, boost, tips));
}

/* ---------- messages ---------- */
openidea.onMessage((text) => {
  const msg = JSON.parse(text);
  switch (msg.type) {
    case "overview":
      state.overview = msg;
      state.runner = msg.runner;
      $("brand-sub").textContent = msg.name + (msg.laravel ? " · " + msg.laravel : "");
      renderNav();
      if (state.section === "overview") renderOverview();
      break;
    case "section":
      state.data[msg.id] = msg;
      renderSection(msg.id);
      renderNav();
      break;
    case "commands":
      Object.assign(state, { commands: msg.commands, globals: msg.globals, history: msg.history || [], runner: msg.runner });
      if (state.section === "artisan") { renderCommandList(); renderForm(); }
      break;
    case "ran":
      state.history = msg.history || state.history;
      if (msg.error) toast(msg.error);
      if (state.section === "artisan") renderCommandList();
      break;
    case "output":
      $("out-dot").className = "status-dot " + (msg.ok ? "ok" : "fail");
      $("out-runner").textContent = msg.runner || "";
      $("out-text").replaceChildren(ansi(msg.text || "(no output)"));
      break;
    case "files":
      state.logs.files = msg.files;
      fillFiles();
      if (!state.logs.path && msg.files.length) { loadLog(msg.files[0].path); fillFiles(); }
      renderEntries();
      break;
    case "entries":
      if (msg.path !== state.logs.path) break;
      if (msg.size < state.logs.size) state.logs.hiddenBefore = 0;
      Object.assign(state.logs, { size: msg.size, entries: msg.entries });
      renderEntries();
      break;
    case "error":
      toast(msg.message);
      break;
    case "navigate": {
      if (!SECTIONS.some((s) => s.id === msg.id)) break;
      if (msg.facets) state.facetSel[msg.id] = { ...msg.facets };
      if (msg.sort) state.sort[msg.id] = msg.sort;
      if (msg.levels) state.logs.levels = new Set(msg.levels);
      if (msg.types) state.audit.types = new Set(msg.types);
      if (typeof msg.follow === "boolean") state.audit.follow = msg.follow;
      if (msg.split) state.tinker.split = msg.split;
      if (msg.code) state.tinker.pending = { code: msg.code, run: !!msg.run };
      go(msg.id);
      if (msg.search) {
        $("search").value = msg.search;
        $("search").dispatchEvent(new Event("input"));
      }
      if (msg.command) {
        const c = state.commands.find((x) => x.name === msg.command);
        if (c) { state.current = c; state.values = msg.values || {}; renderCommandList(); renderForm(); }
      }
      break;
    }
    case "tinkertabs":
      if (msg.tabs && Array.isArray(msg.tabs.tabs) && msg.tabs.tabs.length) { state.tinker.tabs = msg.tabs.tabs; state.tinker.active = msg.tabs.active || msg.tabs.tabs[0].id; }
      if (state.section === "tinker") renderTinker();
      break;
    case "tinker": {
      const r = state.tinker.results[msg.tab] || { started: Date.now() };
      Object.assign(r, { running: false, finished: Date.now(), records: msg.records || [], noise: msg.noise || "", ok: msg.ok, runner: msg.runner });
      state.tinker.results[msg.tab] = r;
      if (state.section === "tinker") { if (state.tinker.active === msg.tab) renderTinkerOutput(); renderTinker(); }
      break;
    }
    case "agents": {
      const G = state.agents;
      G.busy = false;
      G.status = Object.assign({}, G.status || {}, msg);
      if (msg.action === "agents" && msg.ok) toast("AI agents connected. Restart the agent session to load the laravel-openidea MCP server.");
      if (msg.action === "agents-off" && msg.ok) toast("Disconnected.");
      if (state.section === "ai") renderAgents();
      break;
    }
    case "auditstatus": {
      const A = state.audit;
      A.busy = false;
      if (msg.active != null) A.active = msg.active;
      A.error = msg.error || null;
      if (msg.action === "install" && msg.active) toast("Recorder on. It records in the local environment; a composer install removes the hook.");
      if (state.section === "audit") renderAudit();
      break;
    }
    case "audit": {
      const A = state.audit;
      if (msg.reset) A.records = [];
      A.records.push(...msg.records);
      if (A.records.length > 6000) A.records.splice(0, A.records.length - 6000);
      A.size = msg.size;
      if (state.section === "audit") renderAuditList();
      break;
    }
  }
});

go("overview");
</script>
</body>
</html>
